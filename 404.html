<!DOCTYPE html>
<html lang="ru" class="dark">

<head>
  <meta charset="UTF-8">
  <title>Error 404</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/posts/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/posts/img/favicon-16x16.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<script>
  // On page load or when changing themes, best to add inline in `head` to avoid FOUC
  if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
  } else {
    document.documentElement.classList.remove('dark')
  }
</script>
<!-- component -->
<main class="h-screen w-full flex flex-col justify-center items-center bg-[#1A2238]">
  <h1 class="text-9xl font-extrabold text-white tracking-widest">404</h1>
  <div class="bg-[#FF6A3D] px-2 text-sm rounded rotate-12 absolute">
    Страница не найдена
  </div>
  <button class="mt-5">
    <a href="/"
      class="relative inline-block text-sm font-medium text-[#FF6A3D] group active:text-orange-500 focus:outline-none focus:ring">
      <span
        class="absolute inset-0 transition-transform translate-x-0.5 translate-y-0.5 bg-[#FF6A3D] group-hover:translate-y-0 group-hover:translate-x-0"></span>

      <span class="relative block px-8 py-3 bg-[#1A2238] border border-current">
        <router-link to="/">Вернуться на главную</router-link>
      </span>
    </a>
  </button>
</main>

</html>
